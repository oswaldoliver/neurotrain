<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sempt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f7a45">
<title>Sempt Akademie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: Level-Leiste oben (1–9), darunter ein Level-Panel: Moves-Checkliste links, Farbenvideos rechts; stapelt auf schmalen Screens */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --fg:#14231a; --muted:#5b6d61; --line:#d5ded7;
  --pitch:#1f7a45; --pitch-soft:#e1f0e6; --done:#1f7a45;
  --c1:#e0392b; --c2:#2f6fd6; --c3:#f2b705; --c4:#22a35a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17221b; --fg:#e7efe9; --muted:#9db0a3; --line:#2a3a30;
  --pitch:#4cc27c; --pitch-soft:#1c3326; --done:#4cc27c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17221b; --fg:#e7efe9; --muted:#9db0a3; --line:#2a3a30;
  --pitch:#4cc27c; --pitch-soft:#1c3326; --done:#4cc27c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--pitch)}
.total{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.lv{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;
  padding:10px 0 8px;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.lv small{font-family:var(--body);font-size:.65rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lv[aria-selected="true"]{border-color:var(--pitch);background:var(--pitch);color:#fff}
.lv[aria-selected="true"] small{color:#fff}
.lv.full::after{content:"✓";font-size:.8rem;font-family:var(--body);color:var(--done)}
.lv[aria-selected="true"].full::after{color:#fff}
.lv:focus-visible,.row a:focus-visible,.tile:focus-visible,.chk:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.panel{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
section{min-width:0}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.title h3{font-family:var(--display);font-weight:800;font-size:2rem;margin:0;text-transform:uppercase;text-wrap:balance}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--pitch);transition:width .25s}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{width:30px;height:30px;flex:none;accent-color:var(--pitch);cursor:pointer}
.row .name{flex:1;min-width:0;font-weight:600}
.row .name em{font-style:normal;font-weight:400;color:var(--muted);font-size:.85rem;margin-left:4px}
.row.done .name{color:var(--muted);text-decoration:line-through}
.mus{flex:none;padding:9px 12px;border-radius:99px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;font-size:.85rem}
@media (max-width:480px){.row{flex-wrap:wrap}.row .name{flex-basis:calc(100% - 42px)}}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shot{display:block;aspect-ratio:1.8;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background-color:var(--surface);background-repeat:no-repeat;background-size:106% 438%}
.shot:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
@media (max-width:760px){.shots{grid-template-columns:repeat(2,1fr)}}
.play{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;
  background:var(--pitch-soft);color:var(--pitch);font-weight:700;text-decoration:none;font-size:.9rem}
.play::before{content:"";width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:110px;padding:14px;
  border-radius:14px;color:#fff;text-decoration:none;font-weight:700;overflow:hidden}
.tile b{font-family:var(--display);font-size:1.35rem;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.tile span{font-size:.8rem;opacity:.9;display:flex;align-items:center;gap:6px}
.tile:only-child{grid-column:1/-1}
.tile:nth-child(1){background:var(--c1)} .tile:nth-child(2){background:var(--c2)}
.tile:nth-child(3){background:#c99500;} .tile:nth-child(4){background:var(--c4)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted)}
.extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);text-decoration:none;font-weight:600;font-size:.9rem}
.music .chip{min-width:96px;justify-content:center}
.reset{appearance:none;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem;padding:4px 0}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:.85rem}
.confirm button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
footer{color:var(--muted);font-size:.85rem}
@media (max-width:760px){.panel{grid-template-columns:1fr}.levels{grid-template-columns:repeat(5,1fr)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.player{position:fixed;inset:0;z-index:50;background:rgba(6,12,8,.88);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.pbar{display:flex;align-items:center;gap:10px;color:#fff;flex-wrap:wrap}
.pbar b{flex:1;min-width:0;font-family:var(--display);font-size:1.5rem;text-transform:uppercase;line-height:1.1}
.pbar a,.pbar button{appearance:none;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.pbar button{background:#fff;color:#14231a;border-color:#fff}
.pframe{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pframe iframe{width:100%;height:100%;max-width:calc((100vh - 120px)*16/9);aspect-ratio:16/9;max-height:100%;border:0;border-radius:12px;background:#000}
</style>
</head>

  const lv=L[cur],[d,t]=count(cur);
  $("lvTitle").textContent="Level "+(cur+1);
  $("lvBar").style.width=(t?d/t*100:0)+"%";
  $("lvCount").textContent=`${d}/${t}`;
  $("moves").innerHTML=lv.m.map(([n,s,id,mu])=>`<div class="row${done[id]?" done":""}">
    <input class="chk" type="checkbox" id="c-${id}" data-id="${id}" ${done[id]?"checked":""} aria-label="${esc(n)} geschafft">
    <label class="name" for="c-${id}">${esc(n)}${s?`<em>${s}</em>`:""}</label>
    ${mu?`<a class="mus" href="${url(MID[mu])}" data-play="${MID[mu]}" target="_blank" rel="noopener" aria-label="Musik ${mu}">♪ ${mu}</a>`:""}<a class="play" href="${url(id)}" data-play="${id}" target="_blank" rel="noopener">Ansehen</a></div>`).join("");
  $("shots").innerHTML=[4.9,35.5,66.3,97.9].map((p,k)=>`<a class="shot" href="${url(T[cur][k])}" data-play="${T[cur][k]}" aria-label="${esc((lv.m.find(x=>x[2]===T[cur][k])||["Übung"])[0]+((lv.m.find(x=>x[2]===T[cur][k])||[])[1]?" ("+lv.m.find(x=>x[2]===T[cur][k])[1]+")":""))}" style="background-image:url('https://drive.google.com/thumbnail?id=${lv.img}&sz=w1200');background-position:50% ${p}%"></a>`).join("");
  $("extra").innerHTML=`<a class="chip" href="${url(lv.img)}" data-play="${lv.img}" target="_blank" rel="noopener">Übersichtsbild Level ${cur+1}</a>`;
  $("colors").innerHTML=lv.c.length
    ? `<div class="tiles">${lv.c.map(([n,id],k)=>`<a class="tile" href="${url(id)}" data-play="${id}" target="_blank" rel="noopener" data-id="${ck(cur,id)}"><b>${esc(n)}</b><span>${done[ck(cur,id)]?"✓ geschafft":"Mitmachen · Video "+(k+1)}</span></a>`).join("")}</div>`
    : `<div class="empty">Farbenvideos gibt es ab Level 5. Hier zuerst die Moves sicher lernen.</div>`;
}
function render(){renderLevels();renderLevel()}

$("levels").addEventListener("click",e=>{const b=e.target.closest(".lv");if(!b)return;cur=+b.dataset.i;try{history.replaceState(null,"","#level-"+(cur+1))}catch(_){location.hash="level-"+(cur+1)}render()});
$("moves").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;if(e.target.checked)done[id]=1;else delete done[id];save();render()});
$("colors").addEventListener("click",e=>{const a=e.target.closest(".tile");if(!a)return;done[a.dataset.id]=1;save();setTimeout(render,300)});
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#level-(\d)$/);if(m){cur=+m[1]-1;render()}});

$("music").innerHTML=MUSIC.map(([n,id])=>`<a class="chip" href="${url(id)}" data-play="${id}" target="_blank" rel="noopener">${n}</a>`).join("")+
  `<a class="chip" href="${url(PDF)}" data-play="${PDF}" target="_blank" rel="noopener">Übersicht Musik &amp; Level (PDF)</a>`;

function bindReset(){$("reset").onclick=()=>{$("resetBox").innerHTML=`<span class="confirm">Wirklich alle Haken löschen? <button type="button" id="yes">Ja, löschen</button><button type="button" id="no">Abbrechen</button></span>`;
  $("yes").onclick=()=>{done={};save();restore();render()};$("no").onclick=restore}}
function restore(){$("resetBox").innerHTML=`<button class="reset" id="reset" type="button">Alle Haken zurücksetzen</button>`;bindReset()}
bindReset();
render();
function openPlayer(id,title){$("pTitle").textContent=title;$("pDrive").href=url(id);
  $("pFrame").src="https://drive.google.com/file/d/"+id+"/preview";$("player").hidden=false;document.body.style.overflow="hidden";$("pClose").focus()}
function closePlayer(){$("player").hidden=true;$("pFrame").src="about:blank";document.body.style.overflow=""}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-play]");if(!a)return;e.preventDefault();
  const t=(a.getAttribute("aria-label")?{textContent:a.getAttribute("aria-label")}:null||a.querySelector("b")||a.closest(".row")?.querySelector(".name")||a).textContent.trim();openPlayer(a.dataset.play,t)});
$("pClose").onclick=closePlayer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("player").hidden)closePlayer()});
</script>
</body>
</html>
